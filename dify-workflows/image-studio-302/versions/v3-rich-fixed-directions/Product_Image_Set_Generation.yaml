    - id: normalize
      type: custom
      data:
        type: code
        title: 核对图片结果
        desc: ''
        selected: false
        code_language: python3
        code: "\"\"\"Dify Code 节点：只向调用端返回受控结果，不回显供应商错误正文。\"\"\"\nimport json\nfrom\
          \ urllib.parse import urlsplit\n\n\ndef normalize_response(body: str, status_code:\
          \ int, metadata: dict, job=None) -> dict:\n    \"\"\"归一化同步图片响应；job 为套图当前图位或\
          \ None，返回 result 对象，不对响应格式异常抛错。\n\n    网络超时由 HTTP 节点默认值进入本节点，不能自动重试，防止供应商已完成生图时重复扣费。\n\
          \    \"\"\"\n    expected = 1 if job else metadata['expected']\n    result\
          \ = {'kind':metadata['kind'],\n              'contract_version':metadata['contract_version'],'status':'failed',\n\
          \              'images':[],'expected':expected,'error_code':'UPSTREAM_HTTP_ERROR',\n\
          \              'retry_advice':'check_provider_before_retry','model':metadata['model']}\n\
          \    if job:\n        result.update({'slot_id':job['slot_id'],'index':job['index'],'role':job['role'],'title':job['title']})\n\
          \    if not isinstance(status_code,(int,float)) or not 200 <= status_code\
          \ < 300:\n        if status_code == 0:\n            result.update(status='unknown',error_code='TRANSPORT_OR_TIMEOUT')\n\
          \        elif status_code in (401,403):\n            result['error_code']\
          \ = 'AUTH_OR_PERMISSION'\n        elif status_code == 429:\n           \
          \ result['error_code'] = 'RATE_LIMIT'\n        return {'result':result}\n\
          \    try:\n        payload = json.loads(body)\n        if not isinstance(payload,dict):\n\
          \            raise ValueError()\n        if payload.get('error'):\n    \
          \        result['error_code'] = 'PROVIDER_ERROR'\n            return {'result':result}\n\
          \        rows = payload.get('data')\n        if not isinstance(rows,list)\
          \ or not rows:\n            raise ValueError()\n        for index,row in\
          \ enumerate(rows):\n            if not isinstance(row,dict):\n         \
          \       raise ValueError()\n            url = row.get('url','')\n      \
          \      parts = urlsplit(url)\n            if parts.scheme != 'https' or\
          \ not parts.hostname or parts.username or parts.password:\n            \
          \    raise ValueError()\n            result['images'].append({'index':index,'url':url})\n\
          \        result['status'] = 'succeeded' if len(result['images']) == expected\
          \ else 'partial'\n        result['error_code'] = '' if result['status']\
          \ == 'succeeded' else 'IMAGE_COUNT_MISMATCH'\n        result['retry_advice']\
          \ = 'none' if result['status'] == 'succeeded' else 'check_provider_before_retry'\n\
          \    except (ValueError, TypeError, AttributeError):\n        result.update(status='failed',images=[],error_code='INVALID_IMAGE_RESPONSE')\n\
          \    return {'result':result}\n\n\ndef main(body, status_code, metadata,\
          \ job) -> dict:\n    \"\"\"绑定 HTTP 与任务字段，返回受控图片结果，无主动异常。\"\"\"\n    return\
          \ normalize_response(body, status_code, metadata, job)\n"
