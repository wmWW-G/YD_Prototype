    - id: aggregate
      type: custom
      data:
        type: code
        title: 按原图位汇总成功与失败
        desc: ''
        selected: false
        code_language: python3
        code: "\"\"\"整套汇总：保留失败图位，输出顺序严格遵循输入而非完成时间。\"\"\"\nimport json\n\n\ndef main(results:\
          \ list, jobs: list, metadata: dict) -> dict:\n    \"\"\"results 为迭代返回数组，jobs\
          \ 为原始方案；返回统一结果和 JSON，不抛常规响应异常。\"\"\"\n    by_id = {row.get('slot_id'):row\
          \ for row in (results or []) if isinstance(row,dict)}\n    ordered = []\n\
          \    for job in jobs:\n        row = by_id.get(job['slot_id']) or {'slot_id':job['slot_id'],'index':job['index'],\n\
          \              'role':job['role'],'title':job['title'],'status':'unknown','images':[],\n\
          \              'error_code':'ITERATION_RESULT_MISSING','retry_advice':'check_provider_before_retry'}\n\
          \        ordered.append(row)\n    successes = sum(row['status'] == 'succeeded'\
          \ for row in ordered)\n    status = 'succeeded' if successes == len(jobs)\
          \ else 'partial' if successes else 'failed'\n    result = {**metadata,'status':status,'items':ordered,'succeeded_count':successes,\n\
          \              'failed_slot_ids':[row['slot_id'] for row in ordered if row['status']!='succeeded']}\n\
          \    return {'result':result,'result_json':json.dumps(result,ensure_ascii=False)}\n"
        variables:
        - variable: results
          value_selector:
          - images
          - output
        - variable: jobs
          value_selector:
          - validate_plan
          - jobs
        - variable: metadata
          value_selector:
          - prepare
          - metadata
        outputs:
          result:
            type: object
            children: null
          result_json:
            type: string
            children: null
