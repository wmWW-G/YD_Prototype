    - id: validate_plan
      type: custom
      data:
        type: code
        title: 校验规划并生成逐张 Prompt
        desc: ''
        selected: false
        code_language: python3
        code: "\"\"\"在收费生图前验证 Lite 的结构化规划；不修补、猜测或静默接受损坏结果。\"\"\"\nimport json\n\n\ndef main(text: str, jobs: list, all_jobs:\
          \ list) -> dict:\n    \"\"\"校验规划并合并受控约束。\n\n    text 为 LLM 原始 JSON，jobs 为本次执行图位，all_jobs 为完整图位。\n    返回 prompt 与\
          \ jobs，保持原图位字段和顺序。JSON/字段/图位错误抛 ValueError，阻止生图。\n    \"\"\"\n    if not isinstance(text, str) or len(text) > 100000:\n\
          \        raise ValueError('规划响应为空或超长')\n    try:\n        plan = json.loads(text)\n    except (ValueError, TypeError):\n\
          \        raise ValueError('规划不是合法 JSON，已停止生图') from None\n    if not isinstance(plan, dict) or set(plan) != {'visual_summary',\
          \ 'style', 'images'}:\n        raise ValueError('规划顶层字段不符合约定')\n    for name in ('visual_summary', 'style'):\n \
          \       if not isinstance(plan[name], str) or not 1 <= len(plan[name].strip()) <= 6000:\n            raise ValueError('规划摘要或风格为空、类型错误或超长')\n\
          \    images = plan['images']\n    if not isinstance(images, list) or len(images) != len(all_jobs):\n        raise\
          \ ValueError('规划图位数量不匹配')\n    by_id = {}\n    for image, expected in zip(images, all_jobs):\n        if not isinstance(image,\
          \ dict) or set(image) != {'slot_id', 'prompt'}:\n            raise ValueError('逐张规划字段不符合约定')\n        if image['slot_id']\
          \ != expected['slot_id'] or image['slot_id'] in by_id:\n            raise ValueError('规划图位标识或顺序不匹配')\n        prompt\
          \ = image['prompt']\n        if not isinstance(prompt, str) or not 1 <= len(prompt.strip()) <= 16000:\n        \
          \    raise ValueError('生图 prompt 为空、类型错误或超长')\n        by_id[image['slot_id']] = prompt.strip()\n    result = []\n\
          \    for job in jobs:\n        # 原任务的事实边界和修改范围始终保留；LLM 规划仅补充可执行视觉细节。\n        prompt = (job['prompt'] + '\\n统一视觉方案：'\
          \ + plan['style']\n                  + '\\n逐张创作规划（如与上述事实或用户限制冲突，以上述限制为准）：'\n                  + by_id[job['slot_id']])\n\
          \        result.append({**job, 'prompt': prompt})\n    if not result:\n        raise ValueError('没有可执行图位')\n   \
          \ return {'prompt': result[0]['prompt'], 'jobs': result}\n"
        variables:
        - variable: text
          value_selector:
          - planner
          - text
        - variable: jobs
          value_selector:
          - prepare
          - jobs
        - variable: all_jobs
          value_selector:
          - prepare
          - all_jobs
        outputs:
          prompt:
            type: string
            children: null
          jobs:
            type: array[object]
            children: null
