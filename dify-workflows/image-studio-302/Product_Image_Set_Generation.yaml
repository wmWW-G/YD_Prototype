          \ aspect_ratio, slots_json, retry_slot_ids_json, image_model) -> dict:\n    \"\"\"接受可序列化的文件元数据，校验失败时终止流程。\"\"\"\n\
          \    return prepare_task(product_image=({'type': product_image_type, 'mime_type': product_image_mime_type, 'size':\
          \ product_image_size} if product_image_type else None), style_image=({'type': style_image_type, 'mime_type': style_image_mime_type,\
