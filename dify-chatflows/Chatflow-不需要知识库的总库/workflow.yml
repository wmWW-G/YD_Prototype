        variables:
        - variable: skill_key
          label: 业务 Skill
          type: select
          required: true
          options:
          - customer-research
          - market-research
          value_selector: []
        - variable: model_key
          label: 生成模型
          type: select
          required: true
          options:
          - gemini-3.5-flash
          - deepseek-v4-pro
          value_selector: []
      position:
        x: 30.0
        y: 1240.0
      positionAbsolute:
        x: 30.0
        y: 1240.0
      width: 244
      height: 90
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: filter_images
      type: custom
      data:
        type: list-operator
        title: 筛选图片
        desc: 只保留 image 类型的附件，避免把 PDF、Word、Excel 误传给视觉模型。
        selected: false
        variable:
        - sys
        - files
        var_type: array[file]
        item_var_type: file
        filter_by:
          enabled: true
          conditions:
          - key: type
            comparison_operator: in
            value:
            - image
        extract_by:
          enabled: false
          serial: '1'
        order_by:
          enabled: false
          key: ''
          value: asc
        limit:
          enabled: false
          size: 10
      position:
