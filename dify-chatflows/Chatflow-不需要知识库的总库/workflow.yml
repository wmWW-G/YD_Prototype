        type: if-else
        title: 是否存在图片
        desc: 有图片才调用视觉模型；无图片时直接生成空图片上下文。
        selected: false
        cases:
        - id: 'true'
          case_id: 'true'
          conditions:
          - id: has_images
            comparison_operator: not empty
            value: ''
            varType: array[file]
            variable_selector:
