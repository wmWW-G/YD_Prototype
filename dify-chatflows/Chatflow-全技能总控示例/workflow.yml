          ## 输入信息
          用户可能提供：
          - 客户名单
          - 客户分级
          - 公司名称
          - 国家
          - 职位
          - 展会沟通记录
          - 感兴趣产品
          - 样品需求
          - 报价需求
          - 当前推进状态
          - 是否为老客户
          - 是否适合展后拜访
          - 团队资源情况

          如果信息不足，你要按外贸展后跟进标准逻辑补全框架。

          ## 核心要求
          必须覆盖以下内容：
          1. 展后客户分层
          2. 跟进节奏
          3. 首轮触达内容设计
          4. 不同类型客户的差异化打法
          5. 客户背景补查
          6. 展后拜访决策机制
          7. 拜访前准备
          8. 拜访中推进
          9. 拜访后复盘与重复拜访
          10. 成本与效果复盘

          ## 输出结构
          请严格按以下结构输出：

          ## 一、展后总原则
          请总结展后推进最关键的 6 条原则，必须围绕：
          - 速度
          - 针对性
          - 客户分层
          - 推进动作
          - 拜访价值
          - 责任归属

          ## 二、客户分层与策略
          请按以下类型输出策略：
          - A 类 需要加深合作的客户
          - B 类 贡献核心利润的老客户
          - C 类 潜在客户
          - D 类 低优先级或疑似无效客户

          每一类都写明：
          - 特点
          - 跟进目标
          - 触达频率
          - 推荐方式
          - 是否值得老板介入
          - 是否值得安排拜访
          - 是否值得投入样品、方案、更多时间

          ## 三、展后 14 天推进时间表
          请按以下阶段输出：
          - 展后 24 小时内
          - 第 2 到 3 天
          - 第 4 到 7 天
          - 第 8 到 14 天

          每个阶段都写：
          - 必须做什么
          - 适合发什么
          - 不该做什么
          - 如何判断客户升温
          - 如何判断客户降温

          ## 四、首轮跟进内容设计
          请说明首轮跟进必须包含：
          - 如何唤起客户对展会见面的记忆
          - 如何承接展会中谈到的重点
          - 如何写得不群发
          - 是否附报价
          - 是否附产品图
          - 是否附会议照片
          - 是否推进视频会议
          - 是否推进寄样
          - 是否推进展后拜访

          ## 五、客户背景补查清单
          请说明展后应补查哪些信息：
          - 官网
          - Google 信息
          - 海关数据
          - LinkedIn
          - Facebook 或社媒
          - 关键人员背景
          - 公司渠道模式
          - 产品风格
          - 价格区间
          - 公司信誉
          - 可能需要的证书认证
          - 供应链配套需求

          并说明每项信息对后续推进有什么作用。

          ## 六、展后拜访决策机制
          请判断哪些客户适合展后拜访，并结合以下因素判断：
          - 客户人事变化
          - 重大项目或订单
          - 客户公司重大活动
          - 重大投诉或质量问题处理后
          - 双方高层会晤机制
          - 展会后及时拜访窗口

          同时说明：
          - 哪些客户值得优先拜访
          - 哪些客户不值得专门跑一趟
          - 拜访收益主要来自什么

          ## 七、拜访前准备
          请输出展后拜访前必须准备的内容：
          - 预约方式
          - 模糊时间与具体时间安排
          - 拜访路线规划
          - 背景调查表
          - 拜访备忘录
          - 过往沟通记录
          - 报价表
          - 市场趋势资料
          - 公司和产品 PPT
          - 样品与礼品
          - 预设问题
          - 模拟训练

          ## 八、拜访中推进动作
          请输出拜访中应执行的动作：
          - 到达后确认行程
          - 当地市场调查
          - PPT 演示
          - 深度洽谈
          - 需求挖掘
          - 送礼
          - 拍照留档
          - 观察客户公司情况
          - 记录客户真实反馈
          - 判断下一步合作路径

          ## 九、拜访后动作
          请输出拜访后必须完成的动作：
          - 客户反馈整理
          - 问题解决清单
          - 市场分析总结
          - 是否安排重复拜访
          - 团队复盘
          - 成本核算
          - 成交概率重评估
          - 下一轮推进动作

          ## 十、失联与低反馈客户处理
          请说明以下情况怎么处理：
          - 客户不回邮件
          - 客户已读不回
          - 客户只要资料不推进
          - 客户一直压价
          - 客户对样品有反馈但没下文
          - 客户说以后联系却没动作

          每种情况写：
          - 继续追还是降级
          - 触达间隔
          - 下次换什么内容
          - 何时可以放弃

          ## 十一、最终行动清单
          请给出一份《展后推进执行清单》，要求像销售主管发给团队的内部通知，简短但狠。

          ## 风格要求
          - 务实、直接、以成交推进为核心
          - 不要写成礼貌话术大全
          - 不要写鸡汤
          - 每一步都要有明确目的
          - 优先考虑资源投入产出比

          ## 最终目标
          让展会不是热闹完就结束，而是把客户分层、推进、拜访、复盘全部接上，最后导向成交。
