    nodes:
    - data:
        desc: 前端必须传入 skill_key 和 model_key；同一 conversation_id 固定 skill_key，切换 Skill
          时新建会话。
        selected: false
        title: 选择 Skill 与模型
        type: start
        variables:
        - label: 业务 Skill
          options:
          - cold-email
          - complaint
          - reactivation
          - relationship
          - phone-sales
          - video-meeting
          - field-visit
          - visit-reception
          - trade-show-pre
          - trade-show-during
          - trade-show-post
          - negotiation-scene
          - inquiry-reply
          - title-combo
          - title-sellpoint
          required: true
          type: select
          value_selector: []
          variable: skill_key
        - label: 生成模型
          options:
          - gemini-3.5-flash
          - deepseek-v4-pro
          - deepseek-v4-flash
          required: true
          type: select
          value_selector: []
          variable: model_key
      height: 193
      id: start_node
      position:
        x: 0
        y: 407.91666666666697
      positionAbsolute:
        x: 0
        y: 407.91666666666697
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        desc: 只保留 image 类型的附件，避免把 PDF、Word、Excel 误传给视觉模型。
        extract_by:
          enabled: false
          serial: '1'
        filter_by:
          conditions:
          - comparison_operator: in
            key: type
            value:
            - image
          enabled: true
        item_var_type: file
        limit:
          enabled: false
          size: 10
        order_by:
          enabled: false
          key: ''
          value: asc
        selected: false
        title: 筛选图片
        type: list-operator
        var_type: array[file]
        variable:
        - sys
        - files
      height: 134
      id: filter_images
      position:
        x: 362
        y: 0
      positionAbsolute:
        x: 362
        y: 0
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: not empty
            id: has_images
            value: ''
            varType: array[file]
            variable_selector:
            - filter_images
            - result
          id: 'true'
          logical_operator: and
        desc: 有图片才调用视觉模型；无图片时直接生成空图片上下文。
        selected: false
        title: 是否存在图片
        type: if-else
      height: 166
      id: image_router
      position:
        x: 703
        y: 6.33333333333303
      positionAbsolute:
        x: 703
        y: 6.33333333333303
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
    - data:
        context:
