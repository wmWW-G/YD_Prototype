app:
  description: 前端通过 skill_key 路由 14 个外贸 Skill，通过 model_key 路由 Gemini 或 DeepSeek；共享文件解析、知识库和
    Tavily。
  icon: 🧭
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: advanced-chat
  name: 赢单｜全技能总控 Chatflow
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/gemini:0.9.3@f34e3e2c5f1dea8bae213af7c1aa553849366f78c65040d75bd5a1d20caeeba9
    version: null
- current_identifier: null
  type: marketplace
  value:
