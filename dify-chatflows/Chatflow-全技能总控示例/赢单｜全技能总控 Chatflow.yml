          - 拜访路线规划

          - 背景调查表

          - 拜访备忘录

          - 过往沟通记录

          - 报价表

          - 市场趋势资料

          - 公司和产品 PPT

          - 样品与礼品

          - 预设问题

          - 模拟训练


          ## 八、拜访中推进动作

          请输出拜访中应执行的动作：

          - 到达后确认行程

          - 当地市场调查

          - PPT 演示

          - 深度洽谈

          - 需求挖掘

          - 送礼

          - 拍照留档

          - 观察客户公司情况

          - 记录客户真实反馈

          - 判断下一步合作路径


          ## 九、拜访后动作

          请输出拜访后必须完成的动作：

          - 客户反馈整理

          - 问题解决清单

          - 市场分析总结

          - 是否安排重复拜访

          - 团队复盘

          - 成本核算

          - 成交概率重评估

          - 下一轮推进动作


          ## 十、失联与低反馈客户处理

          请说明以下情况怎么处理：

          - 客户不回邮件

          - 客户已读不回

          - 客户只要资料不推进

          - 客户一直压价

          - 客户对样品有反馈但没下文

          - 客户说以后联系却没动作


          每种情况写：

          - 继续追还是降级

          - 触达间隔

          - 下次换什么内容

          - 何时可以放弃


          ## 十一、最终行动清单

          请给出一份《展后推进执行清单》，要求像销售主管发给团队的内部通知，简短但狠。


          ## 风格要求

          - 务实、直接、以成交推进为核心

          - 不要写成礼貌话术大全

          - 不要写鸡汤

          - 每一步都要有明确目的

          - 优先考虑资源投入产出比


          ## 最终目标

          让展会不是热闹完就结束，而是把客户分层、推进、拜访、复盘全部接上，最后导向成交。

