                label:
                  en_US: Follow-up ID
                  zh_Hans: 跟进记录 ID
                human_description:
                  en_US: Numeric follow-up ID.
                  zh_Hans: 跟进记录数字 ID。
                llm_description: Positive ID returned by list_followups.
              - name: customer_id
                type: number
                required: true
                form: llm
                label:
                  en_US: Customer ID
                  zh_Hans: 客户 ID
                human_description:
                  en_US: Owner customer ID.
                  zh_Hans: 记录所属客户 ID。
                llm_description: Positive customer ID associated with the follow-up.
              - name: changes
                type: object
                required: true
                form: llm
                label:
                  en_US: Changed Fields
                  zh_Hans: 要修改的字段
                human_description:
                  en_US: Only fields that should change.
                  zh_Hans: 仅填写需要修改的字段。
                llm_description: Include only explicitly requested changes.
                input_schema:
                  type: object
                  minProperties: 1
                  additionalProperties: false
                  properties:
                    customer_intent:
                      type: string
                      description: Observed customer intent.
                    record_date:
                      type: string
                      description: Date in YYYY-MM-DD.
                    title:
                      type: string
                      description: Short factual title.
                    summary:
                      type: string
                      description: Concise factual summary.
                    follow_up_method:
                      type: string
                      description: Contact method.
                    detail:
                      type: string
                      description: Detailed interaction record.
                    key_points:
                      type: string
                      description: Important points.
                    next_action:
                      type: string
                      description: Agreed next action.
              tool_description: Safely merge explicit changes into a verified follow-up
                record.
              tool_label: 修改跟进记录
              tool_name: update_followup
              type: builtin
            - enabled: true
              extra:
                description: 读取待删除对象并生成五分钟有效的一次性确认令牌，本工具不会删除数据。
              parameters:
                resource_type:
                  auto: 1
                  value: null
                resource_id:
                  auto: 1
                  value: null
              provider_name: garden/yingdan-kass/yingdan-kass
              schemas:
              - name: resource_type
                type: select
                required: true
                form: llm
                label:
                  en_US: Resource Type
                  zh_Hans: 资源类型
                human_description:
                  en_US: Exact object type.
                  zh_Hans: 要删除的准确对象类型。
                llm_description: Choose customer, category, or followup.
                options:
                - label:
                    en_US: Customer
                    zh_Hans: 客户档案
                  value: customer
                - label:
                    en_US: Customer Category
                    zh_Hans: 客户分层
                  value: category
                - label:
                    en_US: Follow-up Record
                    zh_Hans: 跟进记录
                  value: followup
              - name: resource_id
                type: number
                required: true
                form: llm
