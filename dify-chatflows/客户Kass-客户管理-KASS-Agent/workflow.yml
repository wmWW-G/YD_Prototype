              tool_label: 新建跟进记录
              tool_name: create_followup
              type: builtin
            - enabled: true
              extra:
                description: 安全合并修改一条已有跟进记录。
              parameters:
                followup_id:
                  auto: 1
                  value: null
                customer_id:
                  auto: 1
                  value: null
                changes:
                  auto: 1
                  value: null
