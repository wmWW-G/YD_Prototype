                  auto: 1
                  value: null
                customer_ref:
                  auto: 1
                  value: null
                changes:
                  auto: 1
                  value: null
                profile_changes:
                  auto: 1
                  value: null
              provider_name: garden/kass-prototype-crm/kass-prototype-crm
              schemas:
              - name: workspace_id
                type: string
                required: true
                form: llm
                label: {en_US: Workspace ID, zh_Hans: 原型工作区 ID}
                human_description: {en_US: Isolated browser workspace ID., zh_Hans: 当前浏览器隔离工作区 ID。}
                llm_description: Exact workspace_id from current_customer_context.
              - name: customer_ref
                type: string
                required: true
