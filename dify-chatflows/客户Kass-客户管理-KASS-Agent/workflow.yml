                  auto: 1
                  value: null
                record:
                  auto: 1
                  value: null
              provider_name: garden/yingdan-kass/yingdan-kass
              schemas:
              - name: customer_id
                type: number
                required: true
                form: llm
                label:
                  en_US: Customer ID
                  zh_Hans: 客户 ID
                human_description:
                  en_US: Numeric customer ID.
                  zh_Hans: 客户数字 ID。
                llm_description: Positive customer ID returned by list_customers.
              - name: record
                type: object
                required: true
                form: llm
                label:
                  en_US: Follow-up Record
                  zh_Hans: 跟进记录
                human_description:
                  en_US: Confirmed follow-up facts.
                  zh_Hans: 已确认的跟进事实。
                llm_description: record_date and detail are required; never save speculative
                  advice as history.
                input_schema:
                  type: object
                  additionalProperties: false
                  required:
                  - record_date
                  - detail
                  properties:
                    customer_intent:
                      type: string
                      description: Observed customer intent.
                    record_date:
                      type: string
                      description: Required date in YYYY-MM-DD.
                    title:
                      type: string
                      description: Short factual title.
                    summary:
                      type: string
                      description: Concise factual summary.
                    follow_up_method:
                      type: string
                      description: Email
                      phone: null
                      WhatsApp or other method.: null
                    detail:
                      type: string
                      description: Required detailed interaction record.
                    key_points:
                      type: string
                      description: Important points.
                    next_action:
                      type: string
                      description: Agreed next action.
