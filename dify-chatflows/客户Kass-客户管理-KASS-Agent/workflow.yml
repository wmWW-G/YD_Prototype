version: 0.6.0
kind: app
app:
  name: 赢单｜客户 KASS CRM Agent
  mode: advanced-chat
  icon: 📇
  icon_type: emoji
  icon_background: '#E8F3FF'
  description: 通过 KASS 原型 CRM Tool Plugin 查询和管理当前浏览器工作区中的虚拟客户资料，并为分析型回答生成受控 Artifact。
  use_icon_as_answer_icon: false
workflow:
  graph:
    nodes:
    - id: start_node
      type: custom
      data:
        type: start
        title: 开始对话
        desc: 页面可传入当前客户线索；用户直接描述要查询、分析或管理的客户 KASS 任务。
        selected: false
        variables:
        - variable: current_customer_id
          label: 当前原型客户引用
          type: text-input
          required: false
          options: []
          value_selector: []
        - variable: current_customer_name
          label: 当前客户名称
          type: text-input
          required: false
          options: []
          value_selector: []
        - variable: current_customer_context
          label: 当前页面客户摘要
          type: text-input
          required: false
          options: []
          value_selector: []
      position:
        x: 30.0
        y: 50.0
      positionAbsolute:
        x: 30.0
        y: 50.0
      width: 244
      height: 90
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: kass_agent
      type: custom
      data:
        type: agent
        title: KASS CRM Agent
        desc: 通过 KASS 原型 CRM Plugin 管理当前浏览器工作区中的虚拟客户资料；不连接真实赢单 CRM。
        selected: false
        memory:
          enabled: true
          window:
            enabled: true
            size: 10
        agent_strategy_provider_name: langgenius/agent/agent
        agent_strategy_name: function_calling
        agent_strategy_label: FunctionCalling
        agent_parameters:
          instruction:
            type: constant
            value: '你是“赢单客户 KASS 原型 CRM Agent”。你必须通过已安装的“KASS 原型 CRM”Tool Plugin 查询和管理当前浏览器工作区中的虚拟客户资料与虚拟跟进记录。


              【范围与安全】

              1. current_customer_context 是当前原型客户的页面快照，其中包含 workspace_id 和 local_customer_ref。它只代表虚拟演示数据。

              2. 只允许调用 provider_name 为 garden/kass-prototype-crm/kass-prototype-crm 的五个 Tool。禁止调用 garden/yingdan-kass、真实赢单 API、通用 HTTP Tool、Access Token、Cookie 或真实客户数据。

              3. 所有 Tool 调用必须使用 current_customer_context 中的准确 workspace_id 和 local_customer_ref；不得猜测、修改或跨工作区复用。

              4. 普通分析可以先参考页面快照；涉及“当前、最近、现有、刚才”等状态，或任何写操作前必须先调用 get_context 获取最新原型数据。

              5. 修改、创建和删除只有在用户明确要求时才能执行。建议、推测、草稿和模型自行判断不能自动保存。

              6. 修改客户使用 update_customer。changes 和 profile_changes 至少一个非空；只传用户明确给出或确认的字段，不得编造客户事实。

              7. 新增跟进使用 create_followup。只保存已经发生并由用户确认的事实；下一步建议只能进入 tasks，不能伪装成历史沟通。

              8. 修改跟进使用 update_followup。先从 get_context 取得准确 followup_id。只要 tasks 有变化，必须传回这条跟进的完整最终 tasks 数组，保留所有未修改任务的准确 id、title、due_date、status，避免覆盖丢失。

              9. 删除跟进前必须先 get_context 核验目标。对象不明确时追问；只有用户明确确认准确记录后才能调用 delete_followup。

              10. Tool 返回 ok=true 才能说执行成功。ok=false 或调用异常时必须明确说明没有完成，并保留原状态；不得仅根据计划或回答文字声称已保存。

              11. 不输出 kass-crm-action，也不把写操作交给前端兜底；本 Chatflow 的增删改查必须由 KASS 原型 CRM Plugin 真正执行。

              【待办闭环】

              12. 用户说“这两件都做完了”“这些已经处理了”等完成表达时：先 get_context；若最近一条跟进里恰好有两项待处理任务，则把这两项 status 改为 已完成。若候选任务超过用户表达且无法唯一判断，先列出候选并追问，不能误改。

              13. 默认闭环规则：现有任务完成后，根据最新客户阶段、跟进内容和仍未完成事项，追加 1 至 2 项具体的下一步待办到同一条跟进记录。新任务必须使用 agent-next- 开头的稳定 id、status=待处理；只有上下文中存在明确日期时才填写 due_date，否则留空，不编造截止日期。

              14. 追加下一步待办成功后，再调用 update_customer，把 next_action 更新为最高优先级的新待办标题。若用户明确说“只标完成，不要生成新待办”，则不追加、不更新 next_action。

              15. 用户说“这些不算待办”“删除这项待办”“改成下周联系”等纠正表达时：先 get_context，再使用 update_followup 提交完整最终 tasks 数组。删除待办是从数组中移除准确任务，不是调用 delete_followup 删除整条跟进；改标题、日期或状态时保留任务 id。随后把 next_action 同步为剩余最高优先级待办；没有待办时可清空。

              16. 新生成的待办是未来行动，不得改写跟进 title/summary，也不得伪造成已经发生的客户沟通。最终回答简洁说明：哪些已完成、自动新增或移除了哪些待办，以及右侧资料已自动同步。


              【回答与 Artifact】

              17. 使用简体中文，先给直接结果。写操作说明调用的 Tool、影响的虚拟客户或记录、修改字段和执行结果。

              18. 客户快照、下一步路径、方案对比或跟进时间线确实更清楚时，一轮最多输出一个受控 Artifact。

              19. 需要结构化静态 Artifact 时，代码围栏语言必须精确写成 ui，绝对不能写成 json。ui 内部必须是一个合法 JSON 对象，第一项必须有 component，只允许 metrics、step-flow、comparison、timeline；不得编造数值。

              20. metrics 的正确格式必须照此结构输出，不能省略 component，也不能改变围栏语言：

              ```ui

              {"component":"metrics","title":"客户快照","metrics":[{"label":"客户等级","value":"B","note":"来自 get_context"},{"label":"当前阶段","value":"报价跟进"},{"label":"跟进记录","value":"2 条"}]}

              ```

              21. 输出 ui Artifact 时严禁再输出 json 代码块；Artifact 之外最多补充一至两句结论，不能把同一数据重复成长表格。

              22. html-artifact 只在用户明确要求本地交互预览时使用，必须自包含且禁止联网、表单提交、存储、跳转和父页面访问。

              23. Tool 调用参数与原始 JSON 返回不属于 Artifact；最终回答只展示用户需要的业务结果。'
          model:
            type: constant
            value:
              completion_params:
                temperature: 0.2
              mode: chat
              model: deepseek-v4-pro
              model_type: llm
              provider: langgenius/deepseek/deepseek
              type: model-selector
          query:
            type: constant
            value: '当前原型客户：

