              - 客户名称：{{#start_node.current_customer_name#}}

              - 原型工作区与完整客户快照：{{#start_node.current_customer_context#}}


              用户当前请求：

              {{#sys.query#}}


              请先判断是只读分析还是明确的原型写操作。需要最新状态或执行写操作时，必须调用已挂载的 KASS 原型 CRM Plugin；禁止使用真实赢单插件或前端兜底协议。若本轮需要 Artifact，必须遵守 System Prompt 的精确围栏语言：结构化组件只能使用 ui，不能使用 json。'
